services:
  - type: web
    name: port777-ai
    env: python
    region: eu-west
    plan: free
    buildCommand: >-
      python -m pip install --upgrade pip &&
      pip install -r backend/requirements-prod.txt &&
      cd frontend && npm ci && npm run build && cd ..
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: CORS_ORIGINS
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PGCONNECT_TIMEOUT
        value: "10"
      - key: PGPOOL_MAX
        value: "10"
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PAYMOB_MODE
        value: test
      - key: PAYMOB_API_KEY
        sync: false
      - key: PAYMOB_INTEGRATION_ID
        sync: false
      - key: PAYMOB_IFRAME_ID
        sync: false
      - key: PAYMOB_HMAC_SECRET
        sync: false
      - key: PAYMOB_CURRENCY
        value: EGP
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
