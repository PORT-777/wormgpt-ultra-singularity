[package]
name = "port777-evil"
version = "6.1.0"
description = "PORT 777 EVIL — AI workspace"
authors = ["PORT 777"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
